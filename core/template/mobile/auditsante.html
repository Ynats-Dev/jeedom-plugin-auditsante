<div class="eqLogic eqLogic-widget auditsante-widget" data-eqType="#eqType#" data-eqLogic_id="#id#" data-eqLogic_uid="#uid#" data-version="#version#" data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#" style="width: #width#;height: #height#;#style#">
  <div class="text-center widget-name">
    <span class="auditsante-widget-refresh pull-right cursor" title="{{Lancer l'audit}}"><i class="fas fa-sync-alt"></i></span>
    <span class="reportModeVisible">#name_display# <span class="object_name">#object_name#</span></span>
    <a href="#eqLink#" class="reportModeHidden">#name_display# <span class="object_name">#object_name#</span></a>
  </div>

  <a class="auditsante-widget-body" href="#" title="{{Voir le rapport}}" style="--auditsante-widget-color: #grade_color#;">
    <span class="auditsante-widget-gauge">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="auditsante-widget-track" cx="32" cy="32" r="26"></circle>
        <circle class="auditsante-widget-value" cx="32" cy="32" r="26" transform="rotate(-90 32 32)" style="stroke-dasharray: #ring_length#; stroke-dashoffset: #ring_offset#; animation-name: auditsante-widget-fill-#uid#;"></circle>
      </svg>
      <span class="auditsante-widget-grade">#grade#</span>
    </span>
    <span class="auditsante-widget-main">
      <span class="auditsante-widget-verdict">#verdict#</span>
      <span class="auditsante-widget-score"><b>#score#</b><small>%</small></span>
    </span>
  </a>

  <div class="auditsante-widget-counts">
    <span class="auditsante-widget-pill auditsante-widget-fail #fail_class#" title="{{À corriger}}"><i class="fas fa-times"></i> #fail#</span>
    <span class="auditsante-widget-pill auditsante-widget-warn #warn_class#" title="{{À vérifier}}"><i class="fas fa-exclamation"></i> #warn#</span>
    <span class="auditsante-widget-pill auditsante-widget-pass #pass_class#" title="{{Rien à signaler}}"><i class="fas fa-check"></i> #pass#</span>
  </div>
  <div class="auditsante-widget-date"><i class="far fa-clock"></i> #date#</div>

  <style>
    .auditsante-widget {
      display: flex;
      flex-direction: column;
    }
    .auditsante-widget .auditsante-widget-body {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 14px 4px;
      color: inherit !important;
      text-decoration: none !important;
    }
    .auditsante-widget .auditsante-widget-gauge {
      position: relative;
      flex: 0 0 auto;
      width: 62px;
      height: 62px;
    }
    .auditsante-widget .auditsante-widget-gauge svg {
      width: 100%;
      height: 100%;
    }
    .auditsante-widget .auditsante-widget-gauge circle {
      fill: none;
      stroke-width: 6;
    }
    .auditsante-widget .auditsante-widget-track {
      stroke: rgba(127, 127, 127, 0.2);
    }
    .auditsante-widget .auditsante-widget-value {
      stroke: var(--auditsante-widget-color);
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px color-mix(in srgb, var(--auditsante-widget-color) 45%, transparent));
      animation-duration: 1.1s;
      animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      animation-fill-mode: both;
    }
    /* Comme sur la page du plugin : la jauge part de zéro à chaque affichage.
       Bornes explicites (pas de valeur implicite) pour un rendu identique sur tous les navigateurs. */
    @keyframes auditsante-widget-fill-#uid# {
      from { stroke-dashoffset: #ring_length#; }
      to { stroke-dashoffset: #ring_offset#; }
    }
    @media (prefers-reduced-motion: reduce) {
      .auditsante-widget .auditsante-widget-value { animation: none; transition: none; }
    }
    .auditsante-widget .auditsante-widget-grade {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: var(--auditsante-widget-color);
    }
    .auditsante-widget .auditsante-widget-main {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
    }
    .auditsante-widget .auditsante-widget-verdict {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--auditsante-widget-color);
      white-space: nowrap;
    }
    .auditsante-widget .auditsante-widget-score b {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
    }
    .auditsante-widget .auditsante-widget-score small {
      margin-left: 2px;
      font-size: 11px;
      opacity: 0.55;
    }
    .auditsante-widget .auditsante-widget-counts {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 6px 10px 2px;
    }
    .auditsante-widget .auditsante-widget-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .auditsante-widget .auditsante-widget-pill i {
      font-size: 9px;
    }
    .auditsante-widget .auditsante-widget-fail { color: #e5484d; background: rgba(229, 72, 77, 0.14); }
    .auditsante-widget .auditsante-widget-warn { color: #d48806; background: rgba(240, 160, 32, 0.16); }
    .auditsante-widget .auditsante-widget-pass { color: #22a861; background: rgba(34, 168, 97, 0.14); }
    .auditsante-widget .auditsante-widget-pill.is-zero {
      opacity: 0.4;
    }
    .auditsante-widget .auditsante-widget-date {
      padding: 4px 10px 8px;
      font-size: 10px;
      text-align: center;
      opacity: 0.55;
    }
    .auditsante-widget .auditsante-widget-refresh {
      margin-right: 6px;
      color: inherit !important;
      opacity: 0.85;
    }
    .auditsante-widget .auditsante-widget-refresh i {
      color: inherit !important;
      font-size: 12px;
    }
    .auditsante-widget .auditsante-widget-refresh:hover {
      opacity: 1;
    }
    .auditsante-widget .auditsante-widget-refresh.is-running i {
      animation: auditsante-widget-spin 0.8s linear infinite;
    }
    @keyframes auditsante-widget-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function () {
      var widget = document.querySelector('.auditsante-widget[data-eqLogic_uid="#uid#"]')
      if (!widget) return
      var button = widget.querySelector('.auditsante-widget-refresh')
      button.addEventListener('click', function (event) {
        event.preventDefault()
        event.stopPropagation()
        if (button.classList.contains('is-running') || '#refresh_id#' == '') return
        button.classList.add('is-running')
        jeedom.cmd.execute({
          id: '#refresh_id#',
          error: function (error) {
            button.classList.remove('is-running')
            if (typeof jeedomUtils !== 'undefined') jeedomUtils.showAlert({ message: error.message, level: 'danger' })
          },
          success: function () {
            button.classList.remove('is-running')
          }
        })
      })
    })()
  </script>
</div>
